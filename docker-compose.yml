services:
  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
      - --enable-feature=native-histograms
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  # GKE + Cloud SQL metrics from Cloud Monitoring into Prometheus. Grafana's own
  # Cloud Monitoring plugin can't use `gcloud auth application-default login`
  # credentials; this exporter can.
  stackdriver-exporter:
    image: prometheuscommunity/stackdriver-exporter:latest
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /var/secrets/google/application_default_credentials.json
    command:
      - --google.project-ids=qa-setup
      - --monitoring.metrics-prefixes=kubernetes.io/container/cpu
      - --monitoring.metrics-prefixes=kubernetes.io/container/memory
      - --monitoring.metrics-prefixes=kubernetes.io/pod/network
      - --monitoring.metrics-prefixes=cloudsql.googleapis.com/database/cpu
      - --monitoring.metrics-prefixes=cloudsql.googleapis.com/database/memory
      - --monitoring.metrics-prefixes=cloudsql.googleapis.com/database/disk
      - --monitoring.metrics-prefixes=cloudsql.googleapis.com/database/network
      - --monitoring.metrics-prefixes=cloudsql.googleapis.com/database/postgresql/num_backends
      - --monitoring.metrics-prefixes=cloudsql.googleapis.com/database/postgresql/new_connection_count
      - --monitoring.metrics-prefixes=cloudsql.googleapis.com/database/postgresql/transaction_count
      - --monitoring.metrics-prefixes=cloudsql.googleapis.com/database/postgresql/deadlock_count
      - --monitoring.filters=kubernetes.io/container/cpu:resource.labels.cluster_name="qa-private" AND resource.labels.namespace_name="harness-helm-new"
      - --monitoring.filters=kubernetes.io/container/memory:resource.labels.cluster_name="qa-private" AND resource.labels.namespace_name="harness-helm-new"
      - --monitoring.filters=kubernetes.io/pod/network:resource.labels.cluster_name="qa-private" AND resource.labels.namespace_name="harness-helm-new"
      - --monitoring.filters=cloudsql.googleapis.com/database/cpu:resource.labels.database_id="qa-setup:vulnerability-qa"
      - --monitoring.filters=cloudsql.googleapis.com/database/memory:resource.labels.database_id="qa-setup:vulnerability-qa"
      - --monitoring.filters=cloudsql.googleapis.com/database/disk:resource.labels.database_id="qa-setup:vulnerability-qa"
      - --monitoring.filters=cloudsql.googleapis.com/database/network:resource.labels.database_id="qa-setup:vulnerability-qa"
      - --monitoring.filters=cloudsql.googleapis.com/database/postgresql/num_backends:resource.labels.database_id="qa-setup:vulnerability-qa"
      - --monitoring.filters=cloudsql.googleapis.com/database/postgresql/new_connection_count:resource.labels.database_id="qa-setup:vulnerability-qa"
      - --monitoring.filters=cloudsql.googleapis.com/database/postgresql/transaction_count:resource.labels.database_id="qa-setup:vulnerability-qa"
      - --monitoring.filters=cloudsql.googleapis.com/database/postgresql/deadlock_count:resource.labels.database_id="qa-setup:vulnerability-qa"
      - --monitoring.metrics-ingest-delay
      - --collector.fill-missing-labels
      - --stackdriver.http-timeout=30s
    ports:
      - "9255:9255"
    volumes:
      - ${HOME}/.config/gcloud:/var/secrets/google:ro

  grafana:
    image: grafana/grafana:latest
    depends_on:
      - prometheus
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

volumes:
  prometheus-data:
  grafana-data:
