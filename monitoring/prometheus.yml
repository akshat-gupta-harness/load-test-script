global:
  scrape_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Each scrape is a Cloud Monitoring API call, and GKE samples every 60s.
  - job_name: stackdriver
    scrape_interval: 60s
    scrape_timeout: 45s
    static_configs:
      - targets: ["stackdriver-exporter:9255"]
