apiVersion: 1

# The Cloud Monitoring plugin can't authenticate with user ADC, so GCP metrics
# now arrive via stackdriver-exporter into Prometheus instead.
deleteDatasources:
  - name: Google Cloud Monitoring
    orgId: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
